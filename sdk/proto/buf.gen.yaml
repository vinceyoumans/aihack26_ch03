version: v1

# buf.gen.yaml — generates client code for all SDK languages from the single proto file.
#
# Run with: buf generate
# Prerequisites: buf CLI, protoc-gen-go, protoc-gen-go-grpc, protoc-gen-grpc-java, protoc-gen-swift, protoc-gen-grpc-swift
#
# Install:
#   brew install bufbuild/buf/buf
#   go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
#   go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

plugins:
  # ── Go ──────────────────────────────────────────────────────────────────────
  - plugin: buf.build/protocolbuffers/go
    out: ../../gen/go
    opt:
      - paths=source_relative

  - plugin: buf.build/grpc/go
    out: ../../gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false

  # ── Kotlin / Java (gRPC-Java with Kotlin extensions) ────────────────────────
  - plugin: buf.build/protocolbuffers/java
    out: ../../sdk/kotlin/src/main/kotlin/com/tellcartman/grpc/generated
    opt:
      - lite  # smaller runtime, better for Android

  - plugin: buf.build/grpc/java
    out: ../../sdk/kotlin/src/main/kotlin/com/tellcartman/grpc/generated

  # ── Swift ────────────────────────────────────────────────────────────────────
  - plugin: buf.build/apple/swift
    out: ../../sdk/swift/Sources/TellCartmanSDK/Generated
    opt:
      - Visibility=Public

  - plugin: buf.build/grpc/swift
    out: ../../sdk/swift/Sources/TellCartmanSDK/Generated
    opt:
      - Visibility=Public
      - Server=false  # clients only; server is Go
