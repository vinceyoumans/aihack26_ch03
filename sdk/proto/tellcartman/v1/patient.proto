// TellCartman Patient Data Service — Canonical Proto Definition
// Version: 1.0.0
//
// This file is the single source of truth for all TellCartman client SDKs.
// Generated code for Go, Kotlin, Swift, and Rust is derived from this file.
//
// Generation commands:
//   Go:     buf generate (see sdk/proto/buf.gen.yaml)
//   Kotlin: ./gradlew generateProto (see sdk/kotlin/build.gradle)
//   Swift:  swift package generate-xcodeproj (see sdk/swift/Package.swift)
//   Rust:   cargo build (tonic-build runs protoc via build.rs)

syntax = "proto3";

package tellcartman.v1;

// Language-specific generated package/module names:
option go_package     = "github.com/vinceyoumans/aihack26_ch03/server/proto/gen;gen";
option java_package   = "com.tellcartman.grpc.generated";
option java_outer_classname = "PatientProto";
option java_multiple_files = true;
option swift_prefix   = "TC";

import "google/protobuf/timestamp.proto";

// ════════════════════════════════════════════════════════════════════════════
// ENUMS
// ════════════════════════════════════════════════════════════════════════════

// Sex represents the patient's biological sex.
// UNSPECIFIED is always field 0 — required by proto3 for enum default.
enum Sex {
  SEX_UNSPECIFIED = 0;
  SEX_MALE        = 1;
  SEX_FEMALE      = 2;
  SEX_OTHER       = 3;
}

// BloodType is used for health baseline correlation.
enum BloodType {
  BLOOD_TYPE_UNSPECIFIED = 0;
  BLOOD_TYPE_A_POS       = 1;
  BLOOD_TYPE_A_NEG       = 2;
  BLOOD_TYPE_B_POS       = 3;
  BLOOD_TYPE_B_NEG       = 4;
  BLOOD_TYPE_AB_POS      = 5;
  BLOOD_TYPE_AB_NEG      = 6;
  BLOOD_TYPE_O_POS       = 7;
  BLOOD_TYPE_O_NEG       = 8;
}

// MaritalStatus is a social marker relevant to stress baselines.
enum MaritalStatus {
  MARITAL_STATUS_UNSPECIFIED = 0;
  MARITAL_STATUS_SINGLE      = 1;
  MARITAL_STATUS_MARRIED     = 2;
  MARITAL_STATUS_DIVORCED    = 3;
  MARITAL_STATUS_WIDOWED     = 4;
}

// MentalState is a self-reported or AI-assigned mental wellness score.
enum MentalState {
  MENTAL_STATE_UNSPECIFIED = 0;
  MENTAL_STATE_EXCELLENT   = 1;
  MENTAL_STATE_GOOD        = 2;
  MENTAL_STATE_FAIR        = 3;
  MENTAL_STATE_POOR        = 4;
  MENTAL_STATE_VERY_POOR   = 5;
}

// ════════════════════════════════════════════════════════════════════════════
// SUPPORTING MESSAGES
// ════════════════════════════════════════════════════════════════════════════

// GeoLocation captures the patient's position at check-in time.
// Used to correlate environmental hotspots (air quality, UV, pollen) with
// health outcomes across large patient populations.
message GeoLocation {
  double latitude    = 1;
  double longitude   = 2;
  double altitude    = 3;  // meters above sea level, optional
  google.protobuf.Timestamp captured_at = 4;
}

// Objective represents a health goal the patient and coach agreed on.
// Tracked over a defined date range with coach-written corrective notes.
message Objective {
  string id                = 1;  // UUID
  google.protobuf.Timestamp start_date = 2;
  google.protobuf.Timestamp end_date   = 3;
  string current_situation  = 4;  // e.g. "fatigued most afternoons"
  string desired_result     = 5;  // e.g. "energy stable through 4pm"
  string actual_result      = 6;  // filled in at end_date review
  repeated string corrective_notes = 7;  // e.g. "try magnesium at night", "reduce caffeine"
}

// StressorEvent records a discrete stress event logged by the patient.
// The patient can log these via voice (Alexa/Siri) or the mobile app.
// Audio clips are uploaded separately via StreamAudio RPC.
message StressorEvent {
  string id           = 1;  // UUID
  google.protobuf.Timestamp occurred_at = 2;
  string description  = 3;   // e.g. "fight with spouse", "rent due"
  string audio_s3_key = 4;   // set after StreamAudio completes; empty if no audio
  float  stress_level = 5;   // 0.0–10.0; AI-assigned or self-reported
}

// AmbientConditions are pulled from a weather API daily.
// In Stage 1 these are provided in the CSV and submitted with the record.
// In Stage 2 the server will fetch them automatically by geolocation.
message AmbientConditions {
  float temperature_celsius = 1;
  float humidity_percent    = 2;
  float sunshine_hours      = 3;
  float noise_db            = 4;   // ambient noise level in decibels
  google.protobuf.Timestamp recorded_at = 5;
}

// Supplement tracks an over-the-counter supplement the patient is taking.
// The photo field holds an S3 key to a photo of the bottle label —
// AI will later extract brand/dose automatically from the image.
message Supplement {
  string brand        = 1;  // e.g. "Nature Made"
  string name         = 2;  // e.g. "Vitamin D3"
  string dose         = 3;  // e.g. "2000 IU", "500mg"
  string photo_s3_key = 4;  // set after RequestPhotoUpload + upload completes
}

// BodyStatus is a snapshot of physical indicators at a point in time.
// Used for both scheduled morning check-ins and spontaneous random check-ins.
// For morning check-ins, leave urine/stool/mental_state fields empty.
message BodyStatus {
  google.protobuf.Timestamp recorded_at    = 1;
  float       weight_kg           = 2;

  // Photo S3 keys — set after client uploads each photo via presigned URL.
  // Each photo is uploaded directly to S3; the key is stored here.
  string      photo_feet_s3_key   = 3;
  string      photo_hands_s3_key  = 4;
  string      photo_eyes_s3_key   = 5;
  string      photo_face_s3_key   = 6;  // looking for redness/pallor

  // General feeling score: 1 (worst) to 10 (best)
  int32       general_feeling     = 7;

  // ── Random check-in only fields ──────────────────────────────────────────
  // These are empty for scheduled morning check-ins.
  string      photo_urine_s3_key  = 8;   // color and cloudiness analysis
  string      stool_condition     = 9;   // free text; AI parses later
  MentalState mental_state        = 10;
}

// SocialMarkers are physical and lifestyle traits set at registration.
// They rarely change and are used for population-level correlation.
// TODO Stage 2: add diabesity score, allergy panel, sleep apnea flag
message SocialMarkers {
  bool  is_balding    = 1;
  bool  is_obese      = 2;  // BMI > 30
  bool  snores        = 3;
  int32 num_children  = 4;
}

// ════════════════════════════════════════════════════════════════════════════
// CORE PATIENT MESSAGES
// ════════════════════════════════════════════════════════════════════════════

// PatientProfile holds relatively static patient information.
// Submitted once at registration; resent when demographics change.
// This is NOT submitted with every check-in — use PatientRecord for that.
message PatientProfile {
  string        patient_id     = 1;  // UUID assigned by the server at registration
  string        first_name     = 2;
  string        last_name      = 3;
  string        display_name   = 4;  // de-identified alias shown to coaches in the portal
  int32         age            = 5;
  Sex           sex            = 6;
  BloodType     blood_type     = 7;
  MaritalStatus marital_status = 8;
  SocialMarkers social_markers = 9;
  repeated Objective objectives = 10;
}

// PatientRecord is the primary telemetry message submitted at every check-in.
// One record = one check-in event. Clients submit one of these per interval.
// The server publishes it to SQS; Lambda batches and writes to S3.
message PatientRecord {
  string    record_id      = 1;  // UUID assigned by the client before submission
  string    patient_id     = 2;  // must match a registered PatientProfile
  google.protobuf.Timestamp submitted_at = 3;

  GeoLocation        location         = 4;
  AmbientConditions  ambient          = 5;
  BodyStatus         body_status      = 6;
  repeated StressorEvent stressor_events = 7;
  repeated Supplement    supplements     = 8;

  // Source device helps distinguish data quality and context.
  // Use: "ios", "android", "go-simulator", "rust-simulator", "alexa", "siri"
  string source_device   = 9;

  // Schema version allows the server and AI to handle older record formats.
  // Increment when adding required fields. Format: "MAJOR.MINOR.PATCH"
  string schema_version  = 10;  // current: "1.0.0"
}

// ════════════════════════════════════════════════════════════════════════════
// MEDIA MESSAGES
// ════════════════════════════════════════════════════════════════════════════

// AudioChunk is used in the StreamAudio client-streaming RPC.
// The client breaks a 20-second audio clip into chunks and streams them.
// The server reassembles and saves the full clip to S3.
//
// Recommended chunk size: 32KB
// Recommended codec: Opus (audio/ogg; codecs=opus) — small, high quality
message AudioChunk {
  string record_id   = 1;  // ties this audio to a specific PatientRecord
  string patient_id  = 2;
  int32  chunk_index = 3;  // 0-based; server uses this to reassemble in order
  bool   is_last     = 4;  // set true on the final chunk
  bytes  data        = 5;  // raw encoded audio bytes
  string mime_type   = 6;  // "audio/ogg; codecs=opus"
}

// AudioUploadResponse is returned by the server after all chunks are received.
// Store audio_s3_key in StressorEvent.audio_s3_key before submitting the record.
message AudioUploadResponse {
  string audio_s3_key = 1;  // e.g. "audio/pt-001/550e8400-e29b.opus"
  bool   success      = 2;
  string error        = 3;  // empty on success
}

// PhotoUploadRequest asks the server for a presigned S3 PUT URL.
// The client then uploads the photo directly to S3 — the binary never
// passes through the gRPC server, keeping it lightweight.
message PhotoUploadRequest {
  string patient_id  = 1;
  string record_id   = 2;
  // photo_type determines the S3 prefix. Allowed values:
  // "feet", "hands", "eyes", "face", "urine", "supplement"
  string photo_type  = 3;
  string mime_type   = 4;  // "image/jpeg" or "image/png"
  int64  size_bytes  = 5;  // optional; used for Content-Length validation
}

// PhotoUploadResponse contains the presigned URL and the final S3 key.
// After the client PUTs the photo to presigned_url, store s3_key in the
// corresponding BodyStatus photo field before calling SubmitRecord.
message PhotoUploadResponse {
  string presigned_url = 1;  // HTTP PUT to this URL with the photo bytes
  string s3_key        = 2;  // e.g. "photos/pt-001/550e8400-face.jpg"
  google.protobuf.Timestamp expires_at = 3;  // presigned URL expiry (15 min)
}

// ════════════════════════════════════════════════════════════════════════════
// RPC RESPONSES
// ════════════════════════════════════════════════════════════════════════════

// SubmitRecordResponse acknowledges receipt of a PatientRecord.
// On accepted=false, inspect error and retry with backoff.
message SubmitRecordResponse {
  string record_id = 1;   // echoes the submitted record_id for correlation
  bool   accepted  = 2;
  string error     = 3;   // empty on success
}

// ════════════════════════════════════════════════════════════════════════════
// SERVICE DEFINITION
// ════════════════════════════════════════════════════════════════════════════

// PatientDataService is the single gRPC service for all patient data submission.
// All TellCartman clients (iOS, Android, Go, Rust, Kotlin, Swift) use this service.
//
// Connection: gRPC over HTTP/2, port 50051
// Auth: none in Stage 1; mTLS added in Stage 2
service PatientDataService {

  // SubmitRecord sends a single telemetry check-in to the cloud.
  // Call this once per check-in interval (default: every 60 seconds).
  // Attach photo and audio S3 keys BEFORE calling this — upload media first.
  rpc SubmitRecord(PatientRecord) returns (SubmitRecordResponse);

  // StreamAudio uploads a 20-second audio clip as a stream of chunks.
  // Call this BEFORE SubmitRecord. Use the returned audio_s3_key to set
  // StressorEvent.audio_s3_key in the PatientRecord.
  //
  // Client-streaming: client sends many AudioChunk messages, server replies once.
  rpc StreamAudio(stream AudioChunk) returns (AudioUploadResponse);

  // RequestPhotoUpload returns a presigned S3 URL for direct photo upload.
  // Call this BEFORE SubmitRecord. Upload the photo via HTTP PUT to the
  // returned presigned_url, then set the s3_key in the BodyStatus photo field.
  rpc RequestPhotoUpload(PhotoUploadRequest) returns (PhotoUploadResponse);
}
