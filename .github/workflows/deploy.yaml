# .github/workflows/deploy.yaml
# TellCartman Deploy Pipeline — infra + app to AWS
#
# TRIGGER: Push to the `deploydev` branch only.
# Every push to deploydev runs CI first, then deploys to the dev environment.
#
# Deploy sequence:
#   1. build          — compile server + lambda (same as ci.yaml)
#   2. deploy-infra   — aws cloudformation deploy (idempotent)
#   3. deploy-lambda  — upload zip to S3, update Lambda function code
#   4. deploy-server  — upload binary to S3, restart EC2 via SSM RunCommand
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   AWS_ACCESS_KEY_ID      — IAM user with CF deploy + S3 + Lambda + SSM permissions
#   AWS_SECRET_ACCESS_KEY  — corresponding secret key
#   AWS_REGION             — your AWS region (e.g. us-east-1)
#   AWS_ACCOUNT_ID         — your 12-digit AWS account ID
#
# These are set per-environment using GitHub Environments (Settings → Environments).
# Create a "dev" environment and scope the secrets there.

name: Deploy

on:
  push:
    branches: [deploydev]

# Only one deploy at a time — prevent race conditions on the same environment
concurrency:
  group: deploy-dev
  cancel-in-progress: false   # don't cancel — let the current deploy finish

env:
  GO_VERSION:   "1.22"
  ENV:          "dev"
  STACK_NAME:   "tellcartman-dev"
  CF_TEMPLATE:  "infra/cloudformation/stack.yaml"
  CF_PARAMS:    "infra/cloudformation/parameters/dev.json"

jobs:

  # ── Build ────────────────────────────────────────────────────────────────────
  # Identical to ci.yaml build job — produces artifacts for deploy jobs.
  # We re-build here (not download from CI) to guarantee the deployed binary
  # matches the exact commit being deployed.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        working-directory: server
        run: go mod download

      - name: Run tests (gate — don't deploy if tests fail)
        working-directory: server
        run: go test -race -count=1 -timeout=120s ./...

      - name: Build server binary
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o bin/tc-server \
            ./cmd/server

      - name: Build Lambda zip
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build -trimpath -ldflags="-s -w" -o bin/bootstrap ./cmd/lambda-writer
          cd bin && zip lambda-writer.zip bootstrap

      - uses: actions/upload-artifact@v4
        with:
          name: server-binary
          path: server/bin/tc-server
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: lambda-zip
          path: server/bin/lambda-writer.zip
          retention-days: 1

  # ── Deploy Infrastructure (CloudFormation) ───────────────────────────────────
  # CloudFormation deploy is idempotent — running it on an already-deployed stack
  # only applies changes. If nothing changed, it completes in seconds.
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: [build]
    environment: aiHack-dev    # uses GitHub Environment secrets
    outputs:
      bucket_name:      ${{ steps.outputs.outputs.bucket_name }}
      lambda_function:  ${{ steps.outputs.outputs.lambda_function }}
      instance_id:      ${{ steps.outputs.outputs.instance_id }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # If a prior deploy left the stack in ROLLBACK_COMPLETE, it can't be updated —
      # it must be deleted first. This handles first-deploy failures cleanly.
      - name: Delete rolled-back stack if present
        run: |
          STATUS=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NONE")
          echo "Current stack status: $STATUS"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STATUS" = "ROLLBACK_FAILED" ]; then
            echo "Deleting unusable stack..."
            aws cloudformation delete-stack --stack-name ${{ env.STACK_NAME }}
            aws cloudformation wait stack-delete-complete --stack-name ${{ env.STACK_NAME }}
            echo "Stack deleted."
          fi

      # Discover the default VPC and a public subnet so the EC2 instance has
      # a network to launch into. Keeps the template portable (no hardcoded IDs).
      - name: Discover default VPC and subnet
        id: network
        run: |
          VPC_ID=$(aws ec2 describe-vpcs \
            --filters "Name=isDefault,Values=true" \
            --query "Vpcs[0].VpcId" --output text)
          SUBNET_ID=$(aws ec2 describe-subnets \
            --filters "Name=vpc-id,Values=$VPC_ID" "Name=map-public-ip-on-launch,Values=true" \
            --query "Subnets[0].SubnetId" --output text)
          echo "vpc_id=$VPC_ID"       >> $GITHUB_OUTPUT
          echo "subnet_id=$SUBNET_ID" >> $GITHUB_OUTPUT
          echo "Using VPC $VPC_ID, subnet $SUBNET_ID"

      - name: Download lambda artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: lambda-zip
          path: ./artifacts

      # The Lambda in the stack needs its deployment zip in S3 at CREATE time.
      # We use a dedicated artifacts bucket (separate from the CF-managed data
      # bucket) that this job creates and populates first. This cleanly breaks
      # the chicken-and-egg: data bucket is owned by CloudFormation; the Lambda
      # code bucket is owned by the pipeline.
      - name: Bootstrap artifacts bucket + Lambda zip
        id: artifacts
        run: |
          ART_BUCKET=tc-artifacts-${{ env.ENV }}-${{ secrets.AWS_ACCOUNT_ID }}
          REGION=${{ secrets.AWS_REGION }}

          if ! aws s3api head-bucket --bucket "$ART_BUCKET" 2>/dev/null; then
            echo "Creating artifacts bucket $ART_BUCKET..."
            aws s3api create-bucket \
              --bucket "$ART_BUCKET" \
              --region "$REGION" \
              --create-bucket-configuration LocationConstraint="$REGION"
            aws s3api put-public-access-block \
              --bucket "$ART_BUCKET" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          fi

          aws s3 cp artifacts/lambda-writer.zip "s3://$ART_BUCKET/binaries/lambda-writer.zip"
          echo "art_bucket=$ART_BUCKET" >> $GITHUB_OUTPUT
          echo "Artifacts ready in $ART_BUCKET"

      - name: Deploy CloudFormation stack
        run: |
          aws cloudformation deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --template-file ${{ env.CF_TEMPLATE }} \
            --parameter-overrides \
              Env=${{ env.ENV }} \
              VpcId=${{ steps.network.outputs.vpc_id }} \
              SubnetId=${{ steps.network.outputs.subnet_id }} \
              LambdaS3BucketParam=${{ steps.artifacts.outputs.art_bucket }} \
              LambdaS3KeyParam=binaries/lambda-writer.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset
          echo "CloudFormation deploy complete"

      - name: Get stack outputs
        id: outputs
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)

          LAMBDA=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='LambdaFunctionName'].OutputValue" \
            --output text)

          INSTANCE=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ServerInstanceId'].OutputValue" \
            --output text)

          echo "bucket_name=$BUCKET"   >> $GITHUB_OUTPUT
          echo "lambda_function=$LAMBDA" >> $GITHUB_OUTPUT
          echo "instance_id=$INSTANCE" >> $GITHUB_OUTPUT

          echo "S3 Bucket:   $BUCKET"
          echo "Lambda:      $LAMBDA"
          echo "EC2 Instance: $INSTANCE"

  # ── Deploy Lambda ────────────────────────────────────────────────────────────
  # Upload the Lambda zip to S3, then update the function code.
  # Lambda update is near-instant — new code is live within seconds.
  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    environment: aiHack-dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Download lambda artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: lambda-zip
          path: ./artifacts

      # The Lambda was already created by the stack from the artifacts bucket.
      # This step pushes the latest zip + updates the function code so that
      # subsequent deploys (code-only changes) take effect without a stack update.
      - name: Upload Lambda zip to artifacts bucket
        run: |
          ART_BUCKET=tc-artifacts-${{ env.ENV }}-${{ secrets.AWS_ACCOUNT_ID }}
          aws s3 cp artifacts/lambda-writer.zip \
            s3://$ART_BUCKET/binaries/lambda-writer.zip

      - name: Update Lambda function code
        run: |
          ART_BUCKET=tc-artifacts-${{ env.ENV }}-${{ secrets.AWS_ACCOUNT_ID }}
          aws lambda update-function-code \
            --function-name ${{ needs.deploy-infra.outputs.lambda_function }} \
            --s3-bucket $ART_BUCKET \
            --s3-key binaries/lambda-writer.zip

      - name: Wait for Lambda update
        run: |
          aws lambda wait function-updated \
            --function-name ${{ needs.deploy-infra.outputs.lambda_function }}
          echo "✓ Lambda updated successfully"

  # ── Deploy Server (EC2) ──────────────────────────────────────────────────────
  # Upload the server binary to S3, then use SSM RunCommand to:
  #   1. Pull the new binary from S3
  #   2. Stop the systemd service
  #   3. Replace the binary
  #   4. Start the service
  #
  # Why SSM instead of CodeDeploy?
  #   SSM RunCommand is simpler for a single instance POC. CodeDeploy adds
  #   rolling deploys and rollback — worth adding when you have multiple instances.
  deploy-server:
    name: Deploy Server
    runs-on: ubuntu-latest
    needs: [deploy-infra]
    environment: aiHack-dev

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Download server binary artifact
        uses: actions/download-artifact@v4.3.0
        with:
          name: server-binary
          path: ./artifacts

      # Resolve the data bucket (deterministic name) and instance ID directly
      # from CloudFormation outputs, rather than relying on cross-job outputs.
      - name: Resolve deploy targets
        id: resolve
        run: |
          BUCKET=tellcartman-raw-${{ env.ENV }}-${{ secrets.AWS_ACCOUNT_ID }}
          INSTANCE=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ServerInstanceId'].OutputValue" \
            --output text)
          echo "bucket=$BUCKET"     >> $GITHUB_OUTPUT
          echo "instance=$INSTANCE" >> $GITHUB_OUTPUT
          echo "Bucket: $BUCKET  Instance: $INSTANCE"

      - name: Upload server binary to S3
        run: |
          aws s3 cp artifacts/tc-server \
            s3://${{ steps.resolve.outputs.bucket }}/binaries/server

      - name: Deploy to EC2 via SSM RunCommand
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids ${{ steps.resolve.outputs.instance }} \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -euo pipefail",
              "echo Downloading new server binary...",
              "aws s3 cp s3://${{ steps.resolve.outputs.bucket }}/binaries/server /tmp/tc-server-new",
              "chmod +x /tmp/tc-server-new",
              "echo Stopping service...",
              "systemctl stop tc-server || true",
              "mv /tmp/tc-server-new /usr/local/bin/tc-server",
              "echo Starting service...",
              "systemctl start tc-server",
              "sleep 3",
              "systemctl is-active tc-server && echo Service started successfully",
              "echo Deploy complete: ${{ github.sha }}"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> $GITHUB_OUTPUT
          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command
        run: |
          INSTANCE_ID=${{ steps.resolve.outputs.instance }}
          COMMAND_ID=${{ steps.ssm.outputs.command_id }}

          # Give SSM a moment to register the command before first poll
          sleep 5

          for i in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --query "Status" --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i: SSM command status = $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "✓ Server deployed successfully"
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "✗ SSM command failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --query "StandardErrorContent" --output text
              exit 1
            fi

            sleep 10
          done

          echo "✗ Timed out waiting for SSM command"
          exit 1

      - name: Smoke test deployed server
        run: |
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids ${{ steps.resolve.outputs.instance }} \
            --query "Reservations[0].Instances[0].PublicIpAddress" \
            --output text)

          echo "Testing server at $INSTANCE_IP:50051"

          # grpcurl checks the health of the gRPC server
          # Install grpcurl if not present
          which grpcurl || \
            (curl -sSL https://github.com/fullstorydev/grpcurl/releases/download/v1.9.1/grpcurl_1.9.1_linux_x86_64.tar.gz | \
             tar -xz -C /usr/local/bin grpcurl)

          # List services — only works if reflection is enabled (dev only)
          grpcurl -plaintext $INSTANCE_IP:50051 list || \
            echo "gRPC reflection not enabled (expected in staging/prod)"

          # HTTP health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://$INSTANCE_IP:8080/health)
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✓ Health check passed"
          else
            echo "✗ Health check returned HTTP $HTTP_STATUS"
            exit 1
          fi
