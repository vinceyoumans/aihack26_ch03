# .github/workflows/ci.yaml
# TellCartman CI Pipeline — lint, test, build
#
# Runs on every push and every PR to main.
# Does NOT deploy — deployment happens in deploy.yaml on deploydev branch.
#
# Jobs run in parallel where possible:
#   lint-go  ─┐
#   lint-cf  ─┤─► build (depends on all lint + test passing)
#   test-go  ─┘

name: CI

on:
  push:
    branches: ["**"]          # all branches
    paths:
      - "server/**"
      - "infra/**"
      - "sdk/proto/**"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [main, deploydev]

# Cancel in-progress CI runs on the same branch when a new push arrives.
# Prevents wasted runner minutes on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.22"

jobs:

  # ── Lint: Go ────────────────────────────────────────────────────────────────
  lint-go:
    name: Lint Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.57.2
          working-directory: server
          args: --timeout=5m

  # ── Lint: CloudFormation ────────────────────────────────────────────────────
  lint-cf:
    name: Lint CloudFormation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install cfn-lint
        run: pip install cfn-lint

      - name: Lint CloudFormation template
        run: cfn-lint infra/cloudformation/stack.yaml

  # ── Test: Go ────────────────────────────────────────────────────────────────
  test-go:
    name: Test Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        working-directory: server
        run: go mod download

      - name: Run unit tests
        working-directory: server
        run: |
          go test \
            -race \
            -count=1 \
            -timeout=120s \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Upload coverage report
        uses: actions/upload-artifact@v4.6.2
        with:
          name: coverage
          path: server/coverage.out
          retention-days: 7

  # ── Build: Server + Lambda ──────────────────────────────────────────────────
  # This job runs after lint and test pass. It produces the artifacts
  # that the deploy workflow will push to AWS.
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-go, lint-cf, test-go]
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-go@v5.3.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        working-directory: server
        run: go mod download

      # ── Build gRPC server binary (linux/amd64 for EC2) ─────────────────────
      - name: Build server
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags="-s -w -X main.version=${{ github.sha }}" \
            -o bin/tc-server \
            ./cmd/server

      # ── Build Lambda binary (must be named bootstrap) ──────────────────────
      - name: Build Lambda writer
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
          go build \
            -trimpath \
            -ldflags="-s -w" \
            -o bin/bootstrap \
            ./cmd/lambda-writer
          cd bin && zip lambda-writer.zip bootstrap

      # ── Upload build artifacts ─────────────────────────────────────────────
      # These are consumed by the deploy workflow.
      - name: Upload server binary
        uses: actions/upload-artifact@v4.6.2
        with:
          name: server-binary
          path: server/bin/tc-server
          retention-days: 1

      - name: Upload lambda zip
        uses: actions/upload-artifact@v4.6.2
        with:
          name: lambda-zip
          path: server/bin/lambda-writer.zip
          retention-days: 1
