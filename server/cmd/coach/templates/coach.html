{{define "coach.html"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TellCartman — Coach Dashboard</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
  <style>
    :root {
      --high:#d73027; --watch:#f4a742; --ok:#1a9850;
      --bg:#0f1419; --panel:#1a2029; --text:#e6e6e6; --muted:#8a94a6; --border:#2a3340;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
    header{padding:16px 24px;background:var(--panel);border-bottom:1px solid var(--border)}
    header h1{margin:0;font-size:20px}
    header .meta{color:var(--muted);font-size:13px;margin-top:4px}
    main{padding:20px 24px}
    .legend{display:flex;gap:16px;margin-bottom:16px;font-size:13px}
    .legend span{display:inline-flex;align-items:center;gap:6px}
    .dot{width:10px;height:10px;border-radius:50%}
    .dot.high{background:var(--high)} .dot.watch{background:var(--watch)} .dot.ok{background:var(--ok)}
  </style>
</head>
<body>
  <header>
    <h1>Coach Dashboard</h1>
    <div class="meta">Reading from S3 bucket <code>{{.Bucket}}</code> · generated {{.Generated}} · auto-refreshes every 10s</div>
  </header>
  <main>
    <div class="legend">
      <span><span class="dot high"></span> High risk ({{index .Counts "high"}})</span>
      <span><span class="dot watch"></span> Watch ({{index .Counts "watch"}})</span>
      <span><span class="dot ok"></span> OK ({{index .Counts "ok"}})</span>
    </div>
    <div id="cards" hx-get="/cards" hx-trigger="every 10s" hx-swap="innerHTML">
      {{template "cards.html" .}}
    </div>
  </main>
</body>
</html>{{end}}
